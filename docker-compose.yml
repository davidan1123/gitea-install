# Gitea + Portainer Agent on a Proxmox Docker VM.
# Repositories, config and attachments live on a Synology NAS (NFS, mounted by Docker).
# The database lives in PostgreSQL running on the Synology.
#
# Settings (NAS IP, database password, domain, ...) come from a .env file next to
# this one. Copy .env.example to .env and fill it in; .env is not committed.
#
# Before first start:
#   1. On the VM:       sudo apt install nfs-common
#   2. On the Synology: create <NFS_PATH>/data and an NFS permission rule for
#                       this VM's IP (sys, Squash "No mapping",
#                       "allow users to access mounted subfolders" ticked)
#   3. In pgAdmin:      CREATE USER gitea WITH PASSWORD '...';
#                       CREATE DATABASE gitea OWNER gitea;
#
# Deploy from the VM's shell (not as a Portainer stack, because the agent
# would be restarting itself):
#   sudo docker compose up -d
#
# If this VM already runs a Portainer Agent (e.g. from bambuddy-install),
# delete the portainer_agent service below — only one agent per Docker host.

services:
  gitea:
    image: gitea/gitea:28
    container_name: gitea
    environment:
      - TZ=${TZ:-America/New_York}
      # Gitea runs as this user inside the container and owns /data
      - USER_UID=${PUID:-1000}
      - USER_GID=${PGID:-1000}
      # Database: PostgreSQL on the Synology. Plain password here (not URL-encoded).
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=${NAS_IP}:${DB_PORT:-5432}
      - GITEA__database__NAME=${DB_NAME:-gitea}
      - GITEA__database__USER=${DB_USER:-gitea}
      - GITEA__database__PASSWD=${DB_PASSWORD}
      # Server URLs shown in the web UI and clone links
      - GITEA__server__DOMAIN=${GITEA_DOMAIN}
      - GITEA__server__SSH_DOMAIN=${GITEA_DOMAIN}
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL}
      - GITEA__server__HTTP_PORT=3000
      # Port users put in ssh:// clone URLs (the host port mapped below)
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT:-2222}
      - GITEA__server__SSH_LISTEN_PORT=22
    volumes:
      - gitea_data:/data   # Synology: <NFS_PATH>/data
    ports:
      - "${GITEA_HTTP_PORT:-3000}:3000"
      # 2222 on the VM, because the VM's own SSH server already uses 22
      - "${GITEA_SSH_PORT:-2222}:22"
    restart: unless-stopped
    stop_grace_period: 30s

  portainer_agent:
    image: portainer/agent:lts
    container_name: portainer_agent
    environment:
      - TZ=${TZ:-America/New_York}
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    restart: always

volumes:
  gitea_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_IP},nfsvers=4.1,rw,hard,noatime
      device: ":${NFS_PATH:-/volume1/docker/gitea}/data"
